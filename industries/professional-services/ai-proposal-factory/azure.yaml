name: ai-proposal-factory
resourceGroup: rg-professional-services-04
metadata:
  template: ai-proposal-factory@0.3.0
infra:
  provider: bicep
  path: infra
  module: main
# The application service remains declared for azd inspection and explicit service commands.
# `azd up` is overridden below because the completed deployment also requires Foundry
# agent configuration, Search indexing, deterministic seeding, and a live smoke test.
services:
  web:
    project: .
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
hooks:
  postup:
    shell: pwsh
    run: ./scripts/deploy_phase3.ps1
    dir: .
    interactive: true
    continueOnError: false
workflows:
  up:
    steps:
      - azd: provision
