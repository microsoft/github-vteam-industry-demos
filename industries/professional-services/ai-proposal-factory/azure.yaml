# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ai-proposal-factory

infra:
  provider: bicep
  path: infra

hooks:
  preprovision:
    windows:
      run: ./scripts/azure/run-hook.ps1 preprovision.py
      shell: pwsh
      interactive: false
      continueOnError: false
    posix:
      run: ./scripts/azure/run-hook.sh preprovision.py
      shell: sh
      interactive: false
      continueOnError: false
  postprovision:
    windows:
      run: ./scripts/azure/run-hook.ps1 postprovision.py
      shell: pwsh
      interactive: false
      continueOnError: false
    posix:
      run: ./scripts/azure/run-hook.sh postprovision.py
      shell: sh
      interactive: false
      continueOnError: false

services:
  app:
    project: .
    language: docker
    host: containerapp
    resourceName: ${SERVICE_APP_NAME}
    docker:
      path: ./Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
